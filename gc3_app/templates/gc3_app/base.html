

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mon Application Django{% endblock %}</title>

    <!-- CSS Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Style de la barre de navigation */
    .navbar {
      display: flex;             /* Alignement des éléments sur une seule ligne */
      justify-content: space-between; /* Espace entre le logo et les liens */
      align-items: center;       /* Alignement vertical au centre */
      background-color: #2c3e50;
      padding: 15px 30px;
    }

    /* Style du logo */
    .logo {
      color: #ffffff;
      font-size: 1.5rem;
      font-weight: bold;
      text-decoration: none;
    }

    /* Conteneur des liens */
    .nav-links {
      display: flex;             /* Alignement des liens sur une ligne */
      list-style: none;          /* Supprime les puces de la liste */
      margin: 0;
      padding: 0;
      gap: 20px;                 /* Espacement horizontal entre chaque lien */
    }

    /* Style des liens */
    .nav-links a {
      color: #ffffff;
      text-decoration: none;
      font-size: 1rem;
      transition: color 0.3s;
    }

    /* Effet au survol */
    .nav-links a:hover {
      color: #3498db;
    }
    </style>
</head>
<body>

    <!-- Barre de navigation Bootstrap -->
    <nav class="navbar">
    <a href="#" class="logo">ENTREPRISE VISION BTP</a>
    <ul class="nav-links">
      <li><a href="{% url 'accueil' %}">Accueil</a></li>
      <li><a href="{% url 'inscription' %}">s'inscrire</a></li>
      <li><a href="{% url 'actualite' %}">actualite</a></li>
       <li><a href="{% url 'selection' %}">selection</a></li>
      <li><a href="{% url 'fiche' %}">fiche</a></li>
      <li><a href=" {% url 'admin:index' %}">admin</a></li>
      {% if user.is_staff %}
        <li class="nav-item">
            <a class="nav-link text-warning fw-bold" href="{% url 'fiche' %}">📂 liste complete des ouvriés</a>
        </li>
    {% endif %}
    {% if user.is_staff %}
    <li class="nav-item">
        <a class="nav-link text-warning fw-bold" href="{% url 'selection' %}">📂 listes des ouvriés selectionnés</a>
    </li>
{% endif %}
    </ul>
  </nav>

    <!-- Contenu principal -->
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <!-- JS Bootstrap (nécessaire pour les composants interactifs : modales, dropdowns...) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.min.js"></script>
</body>
</html>
